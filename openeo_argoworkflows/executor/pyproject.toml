[tool.poetry]
name = "openeo-argoworkflows-executor"
version = "2026.7.1"
description = ""
authors = ["sean <sean.hoyal@external.eodc.eu>"]
readme = "README.md"
packages = [{include = "openeo_argoworkflows_executor"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dask-gateway = "^2024.1.0"
openeo-processes-dask = {git = "https://github.com/Eurac-Research-Institute-for-EO/openeo-processes-dask.git", tag = "v2026.7.1-eurac-dev.2", extras = ["implementations", "ml"]}
openeo-processes-save-result = {git = "https://github.com/Eurac-Research-Institute-for-EO/openeo-processes-save-result.git", tag = "v2026.7.1-eurac-dev.3"}
openeo-pg-parser-networkx = {git = "https://github.com/Eurac-Research-Institute-for-EO/openeo-pg-parser-networkx.git", tag = "v2026.7.1-eurac-dev.2"}
pystac-client = ">=0.8.2,<1"
click = ">=8.1.7"
pydantic = "^2.7.0"
odc-stac = ">=0.3.3,<1"
stactools = "^0.4.8"
rioxarray = ">=0.15.1,<1"
netCDF4 = "1.7.2"
xarray = ">=2025.8.0,<2026.0.0"
zarr = ">=3.1,<3.2"
typing-extensions = ">=4.13"
cwltool = ">=3.1"
freezegun = "1.2.2"
importlib-metadata = "6.8.0"
kubernetes = "28.1.0"
msgpack = "1.0.8"
setuptools = "70.0.0"
tenacity = "8.2.3"
urllib3 = "1.26.18"
boto3 = ">=1.26.0"
xgboost = {version = ">=1.5.1", extras = ["dask"]}

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
ipykernel = "^6.15.1"
pre-commit = "^2.20.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.23.0"
pydoc-markdown = "4.8.2"

[tool.poetry.scripts]
openeo_executor = "openeo_argoworkflows_executor.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
